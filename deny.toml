[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
unmaintained = "none" # This usually create a lot of non-actionable noise.
ignore = [
    # Vulnerability advisories whose fixed releases need a newer rustc than the pinned toolchain
    # (rust-toolchain.toml). Each entry names what blocks the fix; drop the entry once the blocker is gone.
    { id = "RUSTSEC-2026-0220", reason = "`ruint` < 1.20.0; the fixed release requires rustc >= 1.90, but zksync-airbender v0.3.1 (via zksync-os) does not build on nightlies that recent (`let_chains` on edition 2021, removed `array_chunks`), so this needs a zksync-os bump first" },
    { id = "RUSTSEC-2026-0009", reason = "`time` < 0.3.55; the fixed release requires rustc >= 1.88 (toolchain bump needed). anvil-zksync does not parse untrusted time strings" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "OpenSSL",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # exceptions are in place due to https://github.com/matter-labs/zksync-os
    # CC0 is a bit unclear about source code: https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
    { allow = ["CC0-1.0"], name = "tiny-keccak" }
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
