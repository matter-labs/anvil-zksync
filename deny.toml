[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0388", reason = '`derivative` is unmaintained, crypto dependenicies (boojum, circuit_encodings and others) rely on it' },
    { id = "RUSTSEC-2024-0436", reason = "`paste` is unmaintained, but is still widely used" },
    # Unmaintained transitive dependencies with no drop-in replacement. None of them is used on a
    # network- or user-input-facing path; revisit when the parent crates are bumped.
    { id = "RUSTSEC-2025-0141", reason = "`bincode` 1.x is unmaintained; pulled in by zksync-os crates (`forward_system`, `cs`, `prover_examples`)" },
    { id = "RUSTSEC-2025-0119", reason = "`number_prefix` is unmaintained; pulled in by `indicatif` (progress bars)" },
    { id = "RUSTSEC-2026-0173", reason = "`proc-macro-error2` is unmaintained; pulled in by `alloy-sol-macro` and `tabled_derive` (proc macros, compile time only)" },
    { id = "RUSTSEC-2025-0134", reason = "`rustls-pemfile` is unmaintained; pulled in by `reqwest` 0.11" },
    { id = "RUSTSEC-2026-0249", reason = "`smartstring` is unmaintained; pulled in by `rhai` via `super-seq-macro` (proc macro, compile time only)" },
    { id = "RUSTSEC-2025-0081", reason = "`unic-char-property` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    { id = "RUSTSEC-2025-0075", reason = "`unic-char-range` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    { id = "RUSTSEC-2025-0080", reason = "`unic-common` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    { id = "RUSTSEC-2025-0074", reason = "`unic-segment` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    { id = "RUSTSEC-2025-0104", reason = "`unic-ucd-segment` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    { id = "RUSTSEC-2025-0098", reason = "`unic-ucd-version` is unmaintained; pulled in by `tera` via `zksync-error-codegen` (build time only)" },
    # Vulnerability advisories that cannot be fixed by a semver-compatible update on the pinned
    # toolchain (nightly-2025-03-19 / rustc 1.87). Each entry names what blocks the fix; drop the entry
    # once the blocker is gone.
    { id = "RUSTSEC-2025-0137", reason = "`ruint` < 1.17.1; fixed releases require rustc >= 1.90 (toolchain bump needed). anvil-zksync does not call `reciprocal_mg10`" },
    { id = "RUSTSEC-2026-0220", reason = "`ruint` < 1.20.0; fixed release requires rustc >= 1.90 (toolchain bump needed)" },
    { id = "RUSTSEC-2026-0009", reason = "`time` < 0.3.55; the fixed release requires rustc >= 1.88 (toolchain bump needed). anvil-zksync does not parse untrusted time strings" },
    { id = "RUSTSEC-2025-0073", reason = "`alloy-dyn-abi` 1.3.x; the fix needs the whole `alloy-core` family >= 1.4, i.e. an `alloy` bump. anvil-zksync does not hash EIP-712 `TypedData`" },
    { id = "RUSTSEC-2026-0194", reason = "`quick-xml` 0.38 via `plist` <- `os_info` <- `posthog-rs`; `plist` >= 1.10 (quick-xml 0.41) requires rustc >= 1.88. Only parses local OS-version plist files for telemetry" },
    { id = "RUSTSEC-2026-0195", reason = "`quick-xml` 0.38 via `plist` <- `os_info` <- `posthog-rs`; `plist` >= 1.10 (quick-xml 0.41) requires rustc >= 1.88. Only parses local OS-version plist files for telemetry" },
    { id = "RUSTSEC-2026-0258", reason = "`h2` 0.3 via `reqwest` 0.11 <- `posthog-rs` fork pinned by `zksync_telemetry`; needs zksync-telemetry to move to a newer posthog-rs. Client-only use for opt-in telemetry" },
    { id = "RUSTSEC-2026-0098", reason = "`rustls-webpki` 0.101 via `rustls` 0.21 <- `reqwest` 0.11 <- `posthog-rs` fork pinned by `zksync_telemetry`; needs zksync-telemetry to move to a newer posthog-rs" },
    { id = "RUSTSEC-2026-0099", reason = "`rustls-webpki` 0.101 via `rustls` 0.21 <- `reqwest` 0.11 <- `posthog-rs` fork pinned by `zksync_telemetry`; needs zksync-telemetry to move to a newer posthog-rs" },
    { id = "RUSTSEC-2026-0104", reason = "`rustls-webpki` 0.101 via `rustls` 0.21 <- `reqwest` 0.11 <- `posthog-rs` fork pinned by `zksync_telemetry`; needs zksync-telemetry to move to a newer posthog-rs" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "Unlicense",
    "MPL-2.0",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "OpenSSL",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "BSL-1.0",
    "Unicode-3.0",
    "CDDL-1.0",
    "CDLA-Permissive-2.0",
]
exceptions = [
    # exceptions are in place due to https://github.com/matter-labs/zksync-os
    # CC0 is a bit unclear about source code: https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
    { allow = ["CC0-1.0"], name = "tiny-keccak" }
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
# SPDX considers OpenSSL to encompass both the OpenSSL and SSLeay licenses
# https://spdx.org/licenses/OpenSSL.html
# ISC - Both BoringSSL and ring use this for their new files
# MIT - "Files in third_party/ have their own licenses, as described therein. The MIT
# license, for third_party/fiat, which, unlike other third_party directories, is
# compiled into non-test libraries, is included below."
# OpenSSL - Obviously
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "allow"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
