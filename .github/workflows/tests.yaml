name: run

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: unit-tests
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-24.04-github-hosted-16core]
    runs-on: ${{ matrix.platform }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1

    - name: Install cargo-nextest
      # Pinned: newer cargo-nextest releases require rustc >= 1.91, but the repo toolchain
      # (rust-toolchain.toml) is nightly-2025-03-19 (rustc 1.87). 0.9.109 is the last release
      # that supports it.
      run: cargo install cargo-nextest --version 0.9.109 --locked

    - name: Run tests
      run: cargo nextest run
